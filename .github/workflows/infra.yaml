# runs tofu plan on each pull to main
on:
  pull_request:
    types: [opened, reopened]
    branches:
      - 'main'
jobs:
  tofu-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run tofu plan
        uses: dnogu/tofu-plan@v1
