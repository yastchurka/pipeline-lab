# runs tofu plan on each pull to main
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'main'
jobs:
  tofu-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - uses: opentofu/setup-opentofu@v2
    - run: |
           tofu init
           tofu plan
