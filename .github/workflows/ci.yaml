name: CI

# run this pipeline every time someone pushes to the main branch.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'main'

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t test:${{ github.sha }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: test:${{ github.sha }} 
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Push image to GHCR
          run: |
            docker tag test:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/myapp:${{ github.sha }}
            docker push ghcr.io/${{ github.repository_owner }}/myapp:${{ github.sha }}
